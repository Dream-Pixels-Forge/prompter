name: Release

on:
  push:
    tags:
      - "v*"
      - "v*.*"
      - "v*.*.*"

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.1.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 libdrm-dev libgbm-dev libwebkit2gtk-4.1-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm dist:linux -- --publish never
        env:
          NODE_ENV: production

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > release_body.md << EOF
          ## Prompter v$VERSION

          ### Downloads
          - [Linux AppImage](artifacts/release-linux/Prompter-${VERSION}.AppImage)
          - [Linux deb](artifacts/release-linux/Prompter-${VERSION}-amd64.deb)
          EOF
          echo "body<<DELIM" >> "$GITHUB_OUTPUT"
          cat release_body.md >> "$GITHUB_OUTPUT"
          echo "DELIM" >> "$GITHUB_OUTPUT"
        id: release_body

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Prompter v${{ github.ref_name }}
          body: ${{ steps.release_body.outputs.body }}
          prerelease: false
          files: |
            artifacts/release-linux/*
